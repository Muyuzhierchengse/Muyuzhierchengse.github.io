<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home | Zhimu Yang</title>
    <link rel="stylesheet" href="/css/site-nav.css">
    <script>
        // Play the entrance sequence once per browser tab/session. Returning
        // from About or Research should reveal the home page immediately.
        try {
            if (sessionStorage.getItem("zhimu-home-intro-seen") === "true") {
                document.documentElement.classList.add("skip-home-intro");
            } else {
                sessionStorage.setItem("zhimu-home-intro-seen", "true");
            }
        } catch (error) {
            // If storage is unavailable, keep the normal first-visit animation.
        }

        // The visual sequence is decorative, so visitors can dismiss it at any
        // point without affecting navigation or the page content underneath.
        document.addEventListener("DOMContentLoaded", function () {
            const skipButton = document.querySelector(".intro-skip");
            if (skipButton) {
                skipButton.addEventListener("click", function () {
                    document.documentElement.classList.add("intro-complete");
                });
            }
        });
    </script>
    
<style>
    body {
        margin: 0;
        padding: 0;
        background-color: #fcfbf9;
        color: #2a2a2a;
        font-family: "Palatino Linotype", "Book Antiqua", Palatino, Georgia, serif;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        overflow-x: hidden;
    }

    .home-page .site-nav {
        position: relative;
        z-index: 1;
        margin-top: 40px;
        opacity: 0;
        transform: translateY(15px);
        animation: navReveal 1.2s cubic-bezier(0.16, 1, 0.3, 1) 5.15s forwards;
    }

    @keyframes navReveal {
        to { opacity: 1; transform: translateY(0); }
    }

    /*
     * HYDRANGEA INTRO — five-part timeline
     * 0.0–2.8s  travelling threads gather from the edges
     * 0.4–3.5s  florets follow curved trajectories and are drawn
     * 3.5–4.2s  the completed hydrangea rests at the centre
     * 4.2–5.5s  moving lines disperse while the watermark is printed
     * 5.1–6.2s  navigation and page content are revealed
     *
     * The source geometry remains vector-only. Every petal is an instance of
     * #hydrangea-floret, keeping the artwork editable and the page lightweight.
     */
    .intro-flower-container {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 999;
        overflow: hidden;
        background: #fcfbf9;
        animation: releaseIntro 1s ease 5.45s forwards;
    }

    .intro-stage {
        position: absolute;
        left: 50%;
        top: 50%;
        width: clamp(230px, 30vw, 330px);
        aspect-ratio: 1;
        transform: translate(-50%, -50%);
    }

    .intro-flower {
        width: 100%;
        height: 100%;
        overflow: visible;
        filter: drop-shadow(0 10px 20px rgba(68, 59, 52, 0.035));
    }

    /* Each floret travels through a hand-tuned bend before joining the bloom. */
    .floret {
        opacity: 0;
        transform-origin: 0 0;
        animation: weaveFloret 5.2s cubic-bezier(0.22, 0.7, 0.2, 1) var(--delay) forwards;
    }

    .floret use {
        fill: none;
        stroke: #615b56;
        stroke-width: 0.72;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-dasharray: 260;
        stroke-dashoffset: 260;
        vector-effect: non-scaling-stroke;
        animation: drawFloret 3.5s cubic-bezier(0.25, 1, 0.5, 1) var(--delay) forwards;
    }

    @keyframes weaveFloret {
        0% {
            transform: translate(var(--startX), var(--startY)) rotate(var(--startR)) scale(0.12);
            opacity: 0;
        }
        10% { opacity: 0.74; }
        38% {
            transform: translate(var(--bendX), var(--bendY)) rotate(var(--bendR)) scale(var(--midScale));
            opacity: 0.9;
        }
        65%, 80% {
            transform: translate(var(--endX), var(--endY)) rotate(var(--endR)) scale(var(--scale));
            opacity: 1;
        }
        100% {
            transform: translate(var(--exitX), var(--exitY)) rotate(var(--exitR)) scale(var(--exitScale));
            opacity: 0;
        }
    }

    @keyframes drawFloret {
        to { stroke-dashoffset: 0; }
    }

    /* Long hairline strokes create the impression of the flower being woven. */
    .thread-field {
        position: absolute;
        inset: -4%;
        width: 108%;
        height: 108%;
        overflow: visible;
    }

    .thread-field path {
        fill: none;
        stroke: #817a73;
        stroke-width: 0.75;
        stroke-linecap: round;
        vector-effect: non-scaling-stroke;
        opacity: 0;
        stroke-dasharray: 1;
        stroke-dashoffset: 1;
        animation: weaveThread 5s cubic-bezier(0.42, 0, 0.2, 1) var(--thread-delay) forwards;
    }

    @keyframes weaveThread {
        0% { opacity: 0; stroke-dashoffset: 1; }
        12% { opacity: 0.36; }
        55% { opacity: 0.5; stroke-dashoffset: 0; }
        72% { opacity: 0.25; stroke-dashoffset: 0; }
        100% { opacity: 0; stroke-dashoffset: -1; }
    }

    @keyframes releaseIntro {
        0% { opacity: 1; visibility: visible; }
        100% { opacity: 0; visibility: hidden; }
    }

    .intro-skip {
        position: absolute;
        right: clamp(20px, 4vw, 54px);
        bottom: clamp(18px, 4vh, 38px);
        padding: 8px 4px;
        border: 0;
        border-bottom: 1px solid rgba(65, 60, 55, 0.25);
        background: transparent;
        color: #8a847e;
        font: 10px/1 Georgia, serif;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        cursor: pointer;
        pointer-events: auto;
    }

    .intro-skip:hover,
    .intro-skip:focus-visible { color: #2a2a2a; border-color: #2a2a2a; }

    /* The final "printed" motif is a separate copy for a seamless crossfade. */
    .home-watermark {
        position: fixed;
        right: clamp(-76px, -4vw, -24px);
        bottom: clamp(-64px, -3vw, -18px);
        width: clamp(260px, 34vw, 480px);
        aspect-ratio: 1;
        z-index: 0;
        opacity: 0;
        color: #716b65;
        pointer-events: none;
        animation: printWatermark 1.6s ease 4.35s forwards;
    }

    .home-watermark svg { width: 100%; height: 100%; overflow: visible; }
    .home-watermark use {
        fill: none;
        stroke: currentColor;
        stroke-width: 0.52;
        vector-effect: non-scaling-stroke;
    }

    @keyframes printWatermark {
        from { opacity: 0; transform: translate(18px, 14px) rotate(3deg) scale(1.03); }
        to { opacity: 0.055; transform: translate(0, 0) rotate(0) scale(1); }
    }

    .home-container {
        position: relative;
        z-index: 1;
        max-width: 640px;
        width: 100%;
        text-align: center;
        padding: 40px 20px;
        opacity: 0;
        transform: translateY(10px);
        animation: contentReveal 1.5s cubic-bezier(0.16, 1, 0.3, 1) 5.35s forwards;
    }

    @keyframes contentReveal {
        to { opacity: 1; transform: translateY(0); }
    }

    .skip-home-intro .intro-flower-container,
    .intro-complete .intro-flower-container {
        display: none;
    }

    .skip-home-intro .site-nav,
    .skip-home-intro .home-container,
    .intro-complete .site-nav,
    .intro-complete .home-container {
        opacity: 1;
        transform: none;
        animation: none;
    }

    .skip-home-intro .home-watermark,
    .intro-complete .home-watermark {
        opacity: 0.055;
        transform: none;
        animation: none;
    }

    @media (prefers-reduced-motion: reduce) {
        .intro-flower-container { display: none; }
        .home-page .site-nav,
        .home-container {
            opacity: 1;
            transform: none;
            animation: none;
        }
        .home-watermark { opacity: 0.055; transform: none; animation: none; }
    }

    .avatar { width: 104px; height: 104px; border-radius: 50%; object-fit: cover; filter: grayscale(30%) contrast(1.1); margin-bottom: 24px; box-shadow: 0 8px 24px rgba(0,0,0,0.04); border: 1px solid rgba(0,0,0,0.03); }
    .name { font-size: 22px; letter-spacing: 6px; text-transform: uppercase; margin: 0 0 12px 0; font-weight: normal; color: #1a1a1a; }
    .description { font-size: 15px; font-style: italic; color: #666; margin-bottom: 30px; }
    .divider { font-size: 16px; color: #ccc; letter-spacing: 8px; margin: 30px 0 40px 0; user-select: none; }
    .social-links { margin-bottom: 50px; font-size: 12px; letter-spacing: 2px; text-transform: uppercase; }
    .social-links a { color: #777; text-decoration: none; margin: 0 12px; transition: color 0.4s ease; }
    .social-links a:hover { color: #111; }
    
    .home-footer {
        margin-top: 90px;
        text-align: center;
        /* 启用古典学术文献专属的衬线字体栈 */
        font-family: "EB Garamond", Garamond, Baskerville, "Hoefler Text", "Times New Roman", serif;
        font-size: 16px; /* 略微调大，让衬线（Serif）的笔锋细节更清晰 */
        font-style: italic; /* 学术引用和铭文的标准排版 */
        color: #555; /* 降低纯黑的锐利感，模拟古典墨迹 */
        letter-spacing: 1.5px;
    }

    @media (max-width: 520px) {
        .home-page .site-nav { margin-top: 28px; }
        .home-container { padding-top: 20px; }
        .intro-stage { width: min(68vw, 270px); }
        .home-watermark { width: 310px; right: -112px; bottom: -76px; opacity: 0; }
    }
</style>

</head>
<body class="home-page">

    </defs>
</svg>

            <g class="floret" style="--startX:230px;--startY:90px;--startR:130deg;--bendX:110px;--bendY:50px;--bendR:78deg;--endX:38px;--endY:3px;--endR:35deg;--exitX:230px;--exitY:90px;--exitR:140deg;--scale:.65;--midScale:.36;--exitScale:.47;--delay:.28s"><use href="#hydrangea-floret" /></g>
            <g class="floret" style="--startX:-120px;--startY:220px;--startR:-150deg;--bendX:-75px;--bendY:100px;--bendR:118deg;--endX:-21px;--endY:28px;--endR:65deg;--exitX:-140px;--exitY:210px;--exitR:170deg;--scale:.7;--midScale:.39;--exitScale:.5;--delay:.34s"><use href="#hydrangea-floret" /></g>
            <g class="floret" style="--startX:140px;--startY:220px;--startR:155deg;--bendX:75px;--bendY:100px;--bendR:-95deg;--endX:24px;--endY:26px;--endR:-50deg;--exitX:160px;--exitY:200px;--exitR:-165deg;--scale:.75;--midScale:.42;--exitScale:.54;--delay:.38s"><use href="#hydrangea-floret" /></g>
            <g class="floret" style="--startX:20px;--startY:-230px;--startR:-75deg;--bendX:55px;--bendY:-110px;--bendR:-28deg;--endX:3px;--endY:-42px;--endR:10deg;--exitX:40px;--exitY:-220px;--exitR:88deg;--scale:.55;--midScale:.31;--exitScale:.4;--delay:.12s"><use href="#hydrangea-floret" /></g>
            <g class="floret" style="--startX:-20px;--startY:230px;--startR:180deg;--bendX:-55px;--bendY:110px;--bendR:125deg;--endX:-2px;--endY:42px;--endR:80deg;--exitX:-30px;--exitY:230px;--exitR:184deg;--scale:.6;--midScale:.34;--exitScale:.43;--delay:.2s"><use href="#hydrangea-floret" /></g>
            <g class="floret" style="--startX:-220px;--startY:-160px;--startR:-70deg;--bendX:-85px;--bendY:-22px;--bendR:-8deg;--endX:-12px;--endY:-4px;--endR:30deg;--exitX:-190px;--exitY:-160px;--exitR:132deg;--scale:.5;--midScale:.28;--exitScale:.36;--delay:.3s"><use href="#hydrangea-floret" /></g>
            <g class="floret" style="--startX:220px;--startY:-15px;--startR:90deg;--bendX:90px;--bendY:25px;--bendR:35deg;--endX:15px;--endY:7px;--endR:-10deg;--exitX:220px;--exitY:-20px;--exitR:-105deg;--scale:.5;--midScale:.28;--exitScale:.36;--delay:.36s"><use href="#hydrangea-floret" /></g>
        </svg>
    </div>
    <button class="intro-skip" type="button">Skip</button>
</div>
