<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="view-transition" content="same-origin">
    <title>Home | Zhimu Yang</title>
    <link rel="stylesheet" href="/css/site-nav.css?v=20260902-4col">
    <link rel="stylesheet" href="/css/profile-identity.css?v=20260904-fixed-dark-signature">
    <script>
        // Play the entrance sequence once per browser tab/session. Returning
        // from About or Research should reveal the home page immediately.
        try {
            // Version the key whenever the opening artwork changes materially,
            // so returning visitors are introduced to the new sequence once.
            const forceIntro = new URLSearchParams(window.location.search).get("intro") === "1";
            const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
            document.documentElement.dataset.introMode = forceIntro
                ? "forced"
                : reducedMotion
                    ? "reduced-motion"
                    : "standard";
            if (forceIntro) {
                // A deliberate replay request must win over the operating
                // system's reduced-motion preference, otherwise desktop users
                // can only see a white flash with no way to inspect the intro.
                document.documentElement.classList.add("force-home-intro");
            }
            if (!forceIntro && sessionStorage.getItem("zhimu-home-intro-seen-v12") === "true") {
                document.documentElement.classList.add("skip-home-intro");
            } else {
                sessionStorage.setItem("zhimu-home-intro-seen-v12", "true");
            }
        } catch (error) {
            // If storage is unavailable, keep the normal first-visit animation.
        }

        // The visual sequence is decorative, so visitors can dismiss it at any
        // point without affecting navigation or the page content underneath.
        document.addEventListener("DOMContentLoaded", function () {
            const skipButton = document.querySelector(".intro-skip");
            if (skipButton) {
                skipButton.addEventListener("click", function () {
                    document.documentElement.classList.add("intro-complete");
                });
            }

            const introContainer = document.querySelector(".intro-flower-container");
            if (!introContainer || window.getComputedStyle(introContainer).display === "none") {
                return;
            }

            // A short visible dash first follows a full-screen Bezier route to
            // the exact beginning of each flower stroke. It then draws the
            // normalised one-line path, reverses through that path, and finally
            // retreats along the very same Bezier route used for its entrance.
            const flowerLines = Array.from(document.querySelectorAll(".intro-stage .hydrangea-line"));
            const ingressCanvas = document.querySelector(".ingress-canvas");
            const ingressLines = Array.from(document.querySelectorAll(".ingress-stroke"));
            const viewportWidth = window.innerWidth;
            const viewportHeight = window.innerHeight;
            let sequenceStartedAt = 0;

            function easeInOutSine(value) {
                return -(Math.cos(Math.PI * value) - 1) / 2;
            }

            function clampProgress(value) {
                return Math.max(0, Math.min(1, value));
            }

            function linearMotionProfile(line) {
                const measuredLength = line.getTotalLength();
                const length = Number.isFinite(measuredLength) && measuredLength > 0 ? measuredLength : 1;
                return {
                    length,
                    effectiveLength: length,
                    distanceAt(timeProgress) {
                        return clampProgress(timeProgress);
                    }
                };
            }

            function buildMotionProfile(line, samples = 420) {
                // Array iteration helpers pass extra arguments to callbacks.
                // Normalise the sample count so an accidental index can never
                // produce a zero divisor and blank the complete intro.
                samples = Number.isFinite(samples) && samples >= 24 ? Math.round(samples) : 420;
                const length = linearMotionProfile(line).length;
                const points = [];
                for (let index = 0; index <= samples; index += 1) {
                    points.push(line.getPointAtLength(length * index / samples));
                }
                const cumulative = [0];
                const coveredCells = new Set();
                const cellSize = 9;
                for (let index = 1; index <= samples; index += 1) {
                    const start = points[index - 1];
                    const end = points[index];
                    const segmentLength = Math.hypot(end.x - start.x, end.y - start.y);
                    const checks = Math.max(1, Math.ceil(segmentLength / (cellSize * 0.65)));
                    let freshCells = 0;
                    for (let step = 1; step <= checks; step += 1) {
                        const position = step / checks;
                        const x = start.x + (end.x - start.x) * position;
                        const y = start.y + (end.y - start.y) * position;
                        const key = `${Math.round(x / cellSize)}:${Math.round(y / cellSize)}`;
                        if (!coveredCells.has(key)) {
                            coveredCells.add(key);
                            freshCells += 1;
                        }
                    }
                    // The source art is a static edge-covering walk. Some
                    // branches are necessarily revisited to keep four paths
                    // continuous. Give those already-painted passages only a
                    // sliver of time so the visible line never appears frozen.
                    const novelty = freshCells / checks;
                    cumulative.push(cumulative[index - 1] + 0.08 + novelty * 0.92);
                }
                const totalWeight = cumulative[cumulative.length - 1];
                return {
                    length,
                    effectiveLength: length * totalWeight / samples,
                    distanceAt(timeProgress) {
                        const target = clampProgress(timeProgress) * totalWeight;
                        let low = 0;
                        let high = samples;
                        while (low < high) {
                            const middle = Math.floor((low + high) / 2);
                            if (cumulative[middle] < target) low = middle + 1;
                            else high = middle;
                        }
                        const index = Math.max(1, low);
                        const span = cumulative[index] - cumulative[index - 1] || 1;
                        const local = (target - cumulative[index - 1]) / span;
                        return ((index - 1) + local) / samples;
                    }
                };
            }

            function flowerStartInViewport(line) {
                const firstPoint = line.getPointAtLength(0);
                const svgPoint = line.ownerSVGElement.createSVGPoint();
                svgPoint.x = firstPoint.x;
                svgPoint.y = firstPoint.y;
                return svgPoint.matrixTransform(line.getScreenCTM());
            }

            function ingressRoute(index, target) {
                const w = viewportWidth;
                const h = viewportHeight;
                const routes = [
                    { start: [-56, h * 0.22], c1: [w * 0.22, h * 0.13], c2: [target.x - w * 0.22, target.y + h * 0.04] },
                    { start: [w * 0.78, -56], c1: [w * 0.82, h * 0.24], c2: [target.x + w * 0.16, target.y - h * 0.14] },
                    { start: [-56, h * 0.78], c1: [w * 0.25, h * 0.84], c2: [target.x - w * 0.18, target.y - h * 0.08] },
                    { start: [w * 0.78, h + 56], c1: [w * 0.68, h * 0.78], c2: [target.x + w * 0.18, target.y + h * 0.13] }
                ];
                const route = routes[index];
                return `M ${route.start[0]} ${route.start[1]} C ${route.c1[0]} ${route.c1[1]}, ${route.c2[0]} ${route.c2[1]}, ${target.x} ${target.y}`;
            }

            if (ingressCanvas) {
                ingressCanvas.setAttribute("viewBox", `0 0 ${viewportWidth} ${viewportHeight}`);
            }

            let motionProfiles;
            try {
                motionProfiles = flowerLines.map(function (line) {
                    return buildMotionProfile(line);
                });
            } catch (error) {
                // Geometry sampling is an enhancement, not a requirement: if
                // a browser rejects it, retain a visible linear draw instead.
                motionProfiles = flowerLines.map(function (line) {
                    return linearMotionProfile(line);
                });
            }
            const longestPath = Math.max(1, ...motionProfiles.map(function (profile) { return profile.effectiveLength; }));
            const drawDelays = motionProfiles.map(function (_, index) { return 900 + index * 100; });
            const drawDurations = motionProfiles.map(function (profile) {
                return 1650 + 850 * profile.effectiveLength / longestPath;
            });
            const drawFinish = Math.max(...drawDelays.map(function (delay, index) {
                return delay + drawDurations[index];
            }));
            const unwindBase = drawFinish + 90;
            const unwindDurations = drawDurations.map(function (duration) { return 760 + duration * 0.2; });
            const unwindDelays = motionProfiles.map(function (_, index) { return unwindBase + index * 70; });
            const retreatBase = Math.max(...unwindDelays.map(function (delay, index) {
                return delay + unwindDurations[index];
            })) - 180;

            const motionStates = [];
            flowerLines.forEach(function (line, index) {
                // Every approved flower path has pathLength="1". Keep all
                // flower dashes in that normalised coordinate system; using
                // getTotalLength() here makes browsers reveal the whole path
                // at once instead of drawing it progressively.
                const motionProfile = motionProfiles[index];
                const drawDelay = drawDelays[index];
                const drawDuration = drawDurations[index];
                const unwindDelay = unwindDelays[index];
                const unwindDuration = unwindDurations[index];

                line.style.strokeDasharray = "1 1";
                line.style.strokeDashoffset = "1";
                line.style.opacity = "1";

                const ingress = ingressLines[index];
                let ingressLength = 1;
                let segmentLength = 44;
                if (ingress) {
                    const target = flowerStartInViewport(line);
                    ingress.setAttribute("d", ingressRoute(index, target));
                    ingressLength = ingress.getTotalLength();
                    segmentLength = Math.max(38, Math.min(54, viewportWidth * 0.042));
                    ingress.style.strokeDasharray = `${segmentLength} ${ingressLength + segmentLength}`;
                    ingress.style.strokeDashoffset = "0";
                }
                motionStates.push({
                    line,
                    ingress,
                    ingressLength,
                    motionProfile,
                    ingressDelay: index * 90,
                    ingressDuration: 1150,
                    drawDelay,
                    drawDuration,
                    unwindDelay,
                    unwindDuration,
                    retreatDelay: retreatBase + index * 70,
                    retreatDuration: 1050
                });
            });

            function phaseProgress(elapsed, delay, duration) {
                return clampProgress((elapsed - delay) / duration);
            }

            const sequenceFinish = Math.max(...motionStates.map(function (state) {
                return state.retreatDelay + state.retreatDuration;
            }));

            // One shared frame loop keeps all four strokes in the same visual
            // clock. The previous per-phase loops competed on mobile and made
            // the hand-off around the completed flower feel like a hitch.
            function animateSequence(now) {
                const elapsed = now - sequenceStartedAt;
                motionStates.forEach(function (state) {
                    const drawProgress = phaseProgress(elapsed, state.drawDelay, state.drawDuration);
                    const unwindProgress = phaseProgress(elapsed, state.unwindDelay, state.unwindDuration);
                    if (elapsed < state.drawDelay) {
                        state.line.style.strokeDashoffset = "1";
                    } else if (elapsed < state.drawDelay + state.drawDuration) {
                        state.line.style.strokeDashoffset = `${1 - state.motionProfile.distanceAt(easeInOutSine(drawProgress))}`;
                    } else if (elapsed < state.unwindDelay) {
                        state.line.style.strokeDashoffset = "0";
                    } else if (elapsed < state.unwindDelay + state.unwindDuration) {
                        const remaining = state.motionProfile.distanceAt(1 - easeInOutSine(unwindProgress));
                        state.line.style.strokeDashoffset = `${1 - remaining}`;
                    } else {
                        state.line.style.strokeDashoffset = "1";
                    }

                    if (!state.ingress) return;
                    const ingressProgress = phaseProgress(elapsed, state.ingressDelay, state.ingressDuration);
                    const retreatProgress = phaseProgress(elapsed, state.retreatDelay, state.retreatDuration);
                    if (elapsed < state.ingressDelay) {
                        state.ingress.style.opacity = "0";
                    } else if (elapsed < state.ingressDelay + state.ingressDuration) {
                        state.ingress.style.strokeDashoffset = `${-state.ingressLength * easeInOutSine(ingressProgress)}`;
                        state.ingress.style.opacity = ingressProgress < 0.08
                            ? `${ingressProgress / 0.08}`
                            : ingressProgress > 0.9
                                ? `${(1 - ingressProgress) / 0.1}`
                                : "1";
                    } else if (elapsed < state.retreatDelay) {
                        state.ingress.style.opacity = "0";
                    } else if (elapsed < state.retreatDelay + state.retreatDuration) {
                        state.ingress.style.strokeDashoffset = `${-state.ingressLength * (1 - easeInOutSine(retreatProgress))}`;
                        state.ingress.style.opacity = retreatProgress < 0.08
                            ? `${retreatProgress / 0.08}`
                            : retreatProgress > 0.9
                                ? `${(1 - retreatProgress) / 0.1}`
                                : "1";
                    } else {
                        state.ingress.style.opacity = "0";
                    }
                });
                if (elapsed < sequenceFinish) requestAnimationFrame(animateSequence);
            }
            // Geometry preparation may take noticeably longer on a phone.
            // Start the visual clock only after every path is ready so no
            // device enters the sequence halfway through its first motion.
            sequenceStartedAt = performance.now();
            requestAnimationFrame(animateSequence);
        });
    </script>
    
<style>
    body {
        margin: 0;
        padding: 0;
        background-color: #fcfbf9;
        color: #2a2a2a;
        font-family: "Palatino Linotype", "Book Antiqua", Palatino, Georgia, serif;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        overflow-x: hidden;
    }

    .home-page .site-nav {
        position: relative;
        z-index: 1;
        margin-top: 40px;
        opacity: 0;
        transform: translateY(15px);
        animation: navReveal 1.2s cubic-bezier(0.16, 1, 0.3, 1) 7.05s forwards;
    }

    @keyframes navReveal {
        to { opacity: 1; transform: translateY(0); }
    }

    /*
     * HYDRANGEA INTRO — four continuous paths form the approved artwork.
     * 0.0–1.2s  four short strokes flow inward on organic curved routes
     * 0.9–3.7s  the visible, previously unpainted flower paths are drawn
     * 3.8–5.2s  the paths unweave without a static hold in the middle
     * 5.0–6.4s  the same strokes retreat along their entrance trajectories
     * 6.2–7.0s  the opening sheet fades into the printed watermark
     *
     * The intro and every page watermark read the same SVG source, so their
     * geometry can never drift apart during future revisions.
     */
    .intro-flower-container {
        --flower-size: clamp(260px, 34vw, 380px);
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 999;
        overflow: hidden;
        background: #fcfbf9;
        animation: releaseIntro 0.85s ease 6.15s forwards;
    }

    .intro-stage {
        position: absolute;
        left: 50%;
        top: 50%;
        width: var(--flower-size);
        aspect-ratio: 1;
        transform: translate(-50%, -50%);
    }

    .intro-stage svg {
        width: 100%;
        height: 100%;
        overflow: visible;
        filter: drop-shadow(0 10px 20px rgba(68, 59, 52, 0.035));
    }

    /* The approved centreline itself is the pen; no heavier runner sits on it. */
    .intro-stage .hydrangea-line {
        fill: none;
        stroke: #625d58;
        stroke-width: 1.65;
        stroke-linecap: round;
        stroke-linejoin: round;
        vector-effect: non-scaling-stroke;
        shape-rendering: geometricPrecision;
    }

    .intro-stage .hydrangea-line {
        /* Prevent a flash of the completed drawing before JS measures it. */
        opacity: 0;
    }

    /* Full-viewport curves are invisible; only a short travelling dash shows. */
    .ingress-canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        overflow: visible;
    }

    .ingress-stroke {
        fill: none;
        stroke: #625d58;
        stroke-width: 1.65;
        stroke-linecap: round;
        stroke-linejoin: round;
        vector-effect: non-scaling-stroke;
        shape-rendering: geometricPrecision;
        opacity: 0;
    }

    @keyframes releaseIntro {
        0% { opacity: 1; visibility: visible; }
        100% { opacity: 0; visibility: hidden; }
    }

    .intro-skip {
        position: absolute;
        right: clamp(20px, 4vw, 54px);
        bottom: clamp(18px, 4vh, 38px);
        padding: 8px 4px;
        border: 0;
        border-bottom: 1px solid rgba(65, 60, 55, 0.25);
        background: transparent;
        color: #8a847e;
        font: 10px/1 Georgia, serif;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        cursor: pointer;
        pointer-events: auto;
    }

    .intro-skip:hover,
    .intro-skip:focus-visible { color: #2a2a2a; border-color: #2a2a2a; }

    /* The final "printed" motif is a separate copy for a seamless crossfade. */
    .home-watermark {
        position: fixed;
        right: clamp(-76px, -4vw, -24px);
        bottom: clamp(-64px, -3vw, -18px);
        width: clamp(260px, 34vw, 480px);
        aspect-ratio: 1;
        z-index: 0;
        opacity: 0;
        color: #716b65;
        pointer-events: none;
        animation: printWatermark 1.3s ease 5.55s forwards;
    }

    .home-watermark svg { width: 100%; height: 100%; overflow: visible; }
    .home-watermark .hydrangea-line {
        fill: none;
        stroke: currentColor;
        stroke-width: 2.1;
        vector-effect: non-scaling-stroke;
    }

    @keyframes printWatermark {
        from { opacity: 0; transform: translate(18px, 14px) rotate(3deg) scale(1.03); }
        to { opacity: 0.11; transform: translate(0, 0) rotate(0) scale(1); }
    }

    .home-container {
        position: relative;
        z-index: 1;
        max-width: 640px;
        width: 100%;
        text-align: center;
        padding: 40px 20px;
        opacity: 0;
        transform: translateY(10px);
        animation: contentReveal 1.5s cubic-bezier(0.16, 1, 0.3, 1) 6.25s forwards;
    }

    @keyframes contentReveal {
        to { opacity: 1; transform: translateY(0); }
    }

    .skip-home-intro .intro-flower-container,
    .intro-complete .intro-flower-container {
        display: none;
    }

    .skip-home-intro .site-nav,
    .skip-home-intro .home-container,
    .intro-complete .site-nav,
    .intro-complete .home-container {
        opacity: 1;
        transform: none;
        animation: none;
    }

    .skip-home-intro .home-watermark,
    .intro-complete .home-watermark {
        opacity: 0.11;
        transform: none;
        animation: none;
    }

    @media (prefers-reduced-motion: reduce) {
        .intro-flower-container { display: none; }
        .home-page .site-nav,
        .home-container {
            opacity: 1;
            transform: none;
            animation: none;
        }
        .home-watermark { opacity: 0.11; transform: none; animation: none; }

        /* `?intro=1` is an explicit request to preview the animation. */
        .force-home-intro .intro-flower-container {
            display: block;
        }
    }

    .divider { font-size: 16px; color: #ccc; letter-spacing: 8px; margin: 30px 0 40px 0; user-select: none; }
    
    .home-footer {
        margin-top: 90px;
        text-align: center;
        /* 启用古典学术文献专属的衬线字体栈 */
        font-family: "EB Garamond", Garamond, Baskerville, "Hoefler Text", "Times New Roman", serif;
        font-size: 16px; /* 略微调大，让衬线（Serif）的笔锋细节更清晰 */
        font-style: italic; /* 学术引用和铭文的标准排版 */
        color: #555; /* 降低纯黑的锐利感，模拟古典墨迹 */
        letter-spacing: 1.5px;
    }

    @media (max-width: 520px) {
        .home-page .site-nav { margin-top: 28px; }
        .home-container { padding-top: 20px; }
        .intro-stage { width: min(68vw, 270px); }
        .ingress-stroke { stroke-width: 1.55; }
        .home-watermark { width: 310px; right: -112px; bottom: -76px; opacity: 0; }
    }
</style>

</head>
<body class="home-page">
    
<!-- The full-viewport weave is decorative and deliberately absent after one session play. -->
<div class="intro-flower-container">
    <svg class="ingress-canvas" aria-hidden="true" preserveAspectRatio="none">
        <path class="ingress-stroke"></path>
        <path class="ingress-stroke"></path>
        <path class="ingress-stroke"></path>
        <path class="ingress-stroke"></path>
    </svg>
    <div class="intro-stage" aria-hidden="true">
        {{ partial "hydrangea-art.html" . }}
    </div>
    <button class="intro-skip" type="button">Skip</button>
</div>

<!-- Persistent background impression: the bloom survives as a faint paper watermark. -->
<div class="home-watermark" aria-hidden="true">
    {{ partial "hydrangea-art.html" . }}
</div>

{{ partial "site-nav.html" (dict "active" "home") }}

<div class="home-container">
    {{ partial "profile-identity.html" (dict "mode" "hero") }}

    <div class="divider">☙ ❖ ❧</div>

    <footer class="about-footer" style="text-align: center; margin-top: 90px;">
        <div style="font-size: 15px; color: #444; line-height: 1.8; margin-bottom: 40px;">
            <p><i>“Wir müssen wissen — wir werden wissen”</i></p>
        </div>
    </footer>
</div>

</body>
</html>
