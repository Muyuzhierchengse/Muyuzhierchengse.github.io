<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home | Zhimu Yang</title>
    <link rel="stylesheet" href="/css/site-nav.css">
    <script>
        // Play the entrance sequence once per browser tab/session. Returning
        // from About or Research should reveal the home page immediately.
        try {
            // Version the key whenever the opening artwork changes materially,
            // so returning visitors are introduced to the new sequence once.
            const forceIntro = new URLSearchParams(window.location.search).get("intro") === "1";
            const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
            document.documentElement.dataset.introMode = forceIntro
                ? "forced"
                : reducedMotion
                    ? "reduced-motion"
                    : "standard";
            if (forceIntro) {
                // A deliberate replay request must win over the operating
                // system's reduced-motion preference, otherwise desktop users
                // can only see a white flash with no way to inspect the intro.
                document.documentElement.classList.add("force-home-intro");
            }
            if (!forceIntro && sessionStorage.getItem("zhimu-home-intro-seen-v9") === "true") {
                document.documentElement.classList.add("skip-home-intro");
            } else {
                sessionStorage.setItem("zhimu-home-intro-seen-v9", "true");
            }
        } catch (error) {
            // If storage is unavailable, keep the normal first-visit animation.
        }

        // The visual sequence is decorative, so visitors can dismiss it at any
        // point without affecting navigation or the page content underneath.
        document.addEventListener("DOMContentLoaded", function () {
            const skipButton = document.querySelector(".intro-skip");
            if (skipButton) {
                skipButton.addEventListener("click", function () {
                    document.documentElement.classList.add("intro-complete");
                });
            }

            const introContainer = document.querySelector(".intro-flower-container");
            if (!introContainer || window.getComputedStyle(introContainer).display === "none") {
                return;
            }

            // A short visible dash first follows a full-screen Bezier route to
            // the exact beginning of each flower stroke. It then draws the
            // normalised one-line path, reverses through that path, and finally
            // retreats along the very same Bezier route used for its entrance.
            const flowerLines = Array.from(document.querySelectorAll(".intro-stage .hydrangea-line"));
            const ingressCanvas = document.querySelector(".ingress-canvas");
            const ingressLines = Array.from(document.querySelectorAll(".ingress-stroke"));
            const viewportWidth = window.innerWidth;
            const viewportHeight = window.innerHeight;
            const sequenceStartedAt = performance.now();

            function smoothstep(value) {
                return value * value * (3 - 2 * value);
            }

            function flowerStartInViewport(line) {
                const firstPoint = line.getPointAtLength(0);
                const svgPoint = line.ownerSVGElement.createSVGPoint();
                svgPoint.x = firstPoint.x;
                svgPoint.y = firstPoint.y;
                return svgPoint.matrixTransform(line.getScreenCTM());
            }

            function ingressRoute(index, target) {
                const w = viewportWidth;
                const h = viewportHeight;
                const routes = [
                    { start: [-56, h * 0.22], c1: [w * 0.22, h * 0.13], c2: [target.x - w * 0.22, target.y + h * 0.04] },
                    { start: [w * 0.78, -56], c1: [w * 0.82, h * 0.24], c2: [target.x + w * 0.16, target.y - h * 0.14] },
                    { start: [-56, h * 0.78], c1: [w * 0.25, h * 0.84], c2: [target.x - w * 0.18, target.y - h * 0.08] },
                    { start: [w * 0.78, h + 56], c1: [w * 0.68, h * 0.78], c2: [target.x + w * 0.18, target.y + h * 0.13] }
                ];
                const route = routes[index];
                return `M ${route.start[0]} ${route.start[1]} C ${route.c1[0]} ${route.c1[1]}, ${route.c2[0]} ${route.c2[1]}, ${target.x} ${target.y}`;
            }

            if (ingressCanvas) {
                ingressCanvas.setAttribute("viewBox", `0 0 ${viewportWidth} ${viewportHeight}`);
            }

            flowerLines.forEach(function (line, index) {
                // Every approved flower path has pathLength="1". Keep all
                // flower dashes in that normalised coordinate system; using
                // getTotalLength() here makes browsers reveal the whole path
                // at once instead of drawing it progressively.
                const drawDelay = 1100 + index * 90;
                const drawDuration = 2400;
                const unwindDelay = 4100 + index * 70;
                const unwindDuration = 1050;

                line.style.strokeDasharray = "1 1";
                line.style.strokeDashoffset = "1";
                line.style.opacity = "1";

                const runner = line.cloneNode(false);
                runner.removeAttribute("id");
                runner.classList.remove("hydrangea-line");
                runner.classList.add("hydrangea-runner");
                runner.style.strokeDasharray = "0.045 0.955";
                runner.style.strokeDashoffset = "0";
                runner.style.opacity = "0";
                line.after(runner);

                const ingress = ingressLines[index];
                if (ingress) {
                    const target = flowerStartInViewport(line);
                    ingress.setAttribute("d", ingressRoute(index, target));
                    const ingressLength = ingress.getTotalLength();
                    const segmentLength = Math.max(38, Math.min(58, viewportWidth * 0.045));
                    const ingressDelay = index * 90;
                    const ingressDuration = 1200;
                    const retreatDelay = 5120 + index * 70;
                    const retreatDuration = 1100;
                    ingress.style.strokeDasharray = `${segmentLength} ${ingressLength + segmentLength}`;
                    ingress.style.strokeDashoffset = "0";

                    function ingressFrame(now) {
                        const elapsed = now - sequenceStartedAt - ingressDelay;
                        if (elapsed < 0) {
                            requestAnimationFrame(ingressFrame);
                            return;
                        }
                        const progress = Math.min(elapsed / ingressDuration, 1);
                        const eased = smoothstep(progress);
                        ingress.style.strokeDashoffset = `${-ingressLength * eased}`;
                        if (progress < 0.08) {
                            ingress.style.opacity = `${progress / 0.08}`;
                        } else if (progress > 0.9) {
                            ingress.style.opacity = `${(1 - progress) / 0.1}`;
                        } else {
                            ingress.style.opacity = "1";
                        }
                        if (progress < 1) {
                            requestAnimationFrame(ingressFrame);
                        } else {
                            ingress.style.opacity = "0";
                        }
                    }
                    requestAnimationFrame(ingressFrame);

                    function retreatFrame(now) {
                        const elapsed = now - sequenceStartedAt - retreatDelay;
                        if (elapsed < 0) {
                            requestAnimationFrame(retreatFrame);
                            return;
                        }
                        const progress = Math.min(elapsed / retreatDuration, 1);
                        const eased = smoothstep(progress);
                        // Reverse the entrance dash from the flower start back
                        // to its original point beyond the viewport.
                        ingress.style.strokeDashoffset = `${-ingressLength * (1 - eased)}`;
                        ingress.style.opacity = progress < 0.08
                            ? `${progress / 0.08}`
                            : progress > 0.9
                                ? `${(1 - progress) / 0.1}`
                                : "1";
                        if (progress < 1) {
                            requestAnimationFrame(retreatFrame);
                        } else {
                            ingress.style.opacity = "0";
                        }
                    }
                    requestAnimationFrame(retreatFrame);
                }

                function drawFrame(now) {
                    const elapsed = now - sequenceStartedAt - drawDelay;
                    if (elapsed < 0) {
                        requestAnimationFrame(drawFrame);
                        return;
                    }
                    const progress = Math.min(elapsed / drawDuration, 1);
                    // Smoothstep is stable across browsers and keeps both ends calm.
                    const eased = smoothstep(progress);
                    line.style.strokeDashoffset = `${1 - eased}`;
                    runner.style.strokeDashoffset = `${-0.955 * eased}`;
                    runner.style.opacity = progress < 0.04
                        ? `${progress / 0.04}`
                        : progress > 0.94
                            ? `${(1 - progress) / 0.06}`
                            : "1";
                    if (progress < 1) {
                        requestAnimationFrame(drawFrame);
                    } else {
                        line.style.strokeDashoffset = "0";
                        runner.style.opacity = "0";
                    }
                }
                requestAnimationFrame(drawFrame);

                function unwindFrame(now) {
                    const elapsed = now - sequenceStartedAt - unwindDelay;
                    if (elapsed < 0) {
                        requestAnimationFrame(unwindFrame);
                        return;
                    }
                    const progress = Math.min(elapsed / unwindDuration, 1);
                    const eased = smoothstep(progress);
                    // Positive offset removes ink from the far end back toward
                    // the starting point while the runner marks that retreat.
                    line.style.strokeDashoffset = `${eased}`;
                    runner.style.strokeDashoffset = `${-0.955 * (1 - eased)}`;
                    runner.style.opacity = progress < 0.06
                        ? `${progress / 0.06}`
                        : progress > 0.92
                            ? `${(1 - progress) / 0.08}`
                            : "1";
                    if (progress < 1) {
                        requestAnimationFrame(unwindFrame);
                    } else {
                        line.style.strokeDashoffset = "1";
                        runner.style.opacity = "0";
                    }
                }
                requestAnimationFrame(unwindFrame);
            });
        });
    </script>
    
<style>
    body {
        margin: 0;
        padding: 0;
        background-color: #fcfbf9;
        color: #2a2a2a;
        font-family: "Palatino Linotype", "Book Antiqua", Palatino, Georgia, serif;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        overflow-x: hidden;
    }

    .home-page .site-nav {
        position: relative;
        z-index: 1;
        margin-top: 40px;
        opacity: 0;
        transform: translateY(15px);
        animation: navReveal 1.2s cubic-bezier(0.16, 1, 0.3, 1) 6.55s forwards;
    }

    @keyframes navReveal {
        to { opacity: 1; transform: translateY(0); }
    }

    /*
     * HYDRANGEA INTRO — four continuous paths form the approved artwork.
     * 0.0–1.5s  four short strokes flow inward on organic curved routes
     * 1.1–3.8s  those strokes progressively draw the four one-line paths
     * 3.8–4.1s  the completed hydrangea rests at the centre
     * 4.1–5.4s  the paths unweave from their ends back to their beginnings
     * 5.1–6.5s  the same strokes retreat along their entrance trajectories
     * 6.4–7.2s  the opening sheet fades into the printed watermark
     *
     * The intro and every page watermark read the same SVG source, so their
     * geometry can never drift apart during future revisions.
     */
    .intro-flower-container {
        --flower-size: clamp(260px, 34vw, 380px);
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 999;
        overflow: hidden;
        background: #fcfbf9;
        animation: releaseIntro 0.85s ease 6.35s forwards;
    }

    .intro-stage {
        position: absolute;
        left: 50%;
        top: 50%;
        width: var(--flower-size);
        aspect-ratio: 1;
        transform: translate(-50%, -50%);
    }

    .intro-stage svg {
        width: 100%;
        height: 100%;
        overflow: visible;
        filter: drop-shadow(0 10px 20px rgba(68, 59, 52, 0.035));
    }

    /*
     * A short runner moves along each one-stroke route. The matching ink path
     * reveals at the same pace, creating one uninterrupted drawing gesture.
     */
    .intro-stage .hydrangea-line,
    .intro-stage .hydrangea-runner {
        fill: none;
        stroke: #5f5954;
        stroke-width: 2.35;
        stroke-linecap: round;
        stroke-linejoin: round;
        vector-effect: non-scaling-stroke;
    }

    .intro-stage .hydrangea-line {
        /* Prevent a flash of the completed drawing before JS measures it. */
        opacity: 0;
    }

    .intro-stage .hydrangea-runner {
        stroke-width: 2.8;
    }

    /* Full-viewport curves are invisible; only a short travelling dash shows. */
    .ingress-canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        overflow: visible;
    }

    .ingress-stroke {
        fill: none;
        stroke: #5f5954;
        stroke-width: 2.35;
        stroke-linecap: round;
        stroke-linejoin: round;
        vector-effect: non-scaling-stroke;
        opacity: 0;
    }

    @keyframes releaseIntro {
        0% { opacity: 1; visibility: visible; }
        100% { opacity: 0; visibility: hidden; }
    }

    .intro-skip {
        position: absolute;
        right: clamp(20px, 4vw, 54px);
        bottom: clamp(18px, 4vh, 38px);
        padding: 8px 4px;
        border: 0;
        border-bottom: 1px solid rgba(65, 60, 55, 0.25);
        background: transparent;
        color: #8a847e;
        font: 10px/1 Georgia, serif;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        cursor: pointer;
        pointer-events: auto;
    }

    .intro-skip:hover,
    .intro-skip:focus-visible { color: #2a2a2a; border-color: #2a2a2a; }

    /* The final "printed" motif is a separate copy for a seamless crossfade. */
    .home-watermark {
        position: fixed;
        right: clamp(-76px, -4vw, -24px);
        bottom: clamp(-64px, -3vw, -18px);
        width: clamp(260px, 34vw, 480px);
        aspect-ratio: 1;
        z-index: 0;
        opacity: 0;
        color: #716b65;
        pointer-events: none;
        animation: printWatermark 1.3s ease 5.85s forwards;
    }

    .home-watermark svg { width: 100%; height: 100%; overflow: visible; }
    .home-watermark .hydrangea-line {
        fill: none;
        stroke: currentColor;
        stroke-width: 2.4;
        vector-effect: non-scaling-stroke;
    }

    @keyframes printWatermark {
        from { opacity: 0; transform: translate(18px, 14px) rotate(3deg) scale(1.03); }
        to { opacity: 0.11; transform: translate(0, 0) rotate(0) scale(1); }
    }

    .home-container {
        position: relative;
        z-index: 1;
        max-width: 640px;
        width: 100%;
        text-align: center;
        padding: 40px 20px;
        opacity: 0;
        transform: translateY(10px);
        animation: contentReveal 1.5s cubic-bezier(0.16, 1, 0.3, 1) 6.5s forwards;
    }

    @keyframes contentReveal {
        to { opacity: 1; transform: translateY(0); }
    }

    .skip-home-intro .intro-flower-container,
    .intro-complete .intro-flower-container {
        display: none;
    }

    .skip-home-intro .site-nav,
    .skip-home-intro .home-container,
    .intro-complete .site-nav,
    .intro-complete .home-container {
        opacity: 1;
        transform: none;
        animation: none;
    }

    .skip-home-intro .home-watermark,
    .intro-complete .home-watermark {
        opacity: 0.11;
        transform: none;
        animation: none;
    }

    @media (prefers-reduced-motion: reduce) {
        .intro-flower-container { display: none; }
        .home-page .site-nav,
        .home-container {
            opacity: 1;
            transform: none;
            animation: none;
        }
        .home-watermark { opacity: 0.11; transform: none; animation: none; }

        /* `?intro=1` is an explicit request to preview the animation. */
        .force-home-intro .intro-flower-container {
            display: block;
        }
    }

    .avatar { width: 104px; height: 104px; border-radius: 50%; object-fit: cover; filter: grayscale(30%) contrast(1.1); margin-bottom: 24px; box-shadow: 0 8px 24px rgba(0,0,0,0.04); border: 1px solid rgba(0,0,0,0.03); }
    .name { font-size: 22px; letter-spacing: 6px; text-transform: uppercase; margin: 0 0 12px 0; font-weight: normal; color: #1a1a1a; }
    .description { font-size: 15px; font-style: italic; color: #666; margin-bottom: 30px; }
    .divider { font-size: 16px; color: #ccc; letter-spacing: 8px; margin: 30px 0 40px 0; user-select: none; }
    .social-links { margin-bottom: 50px; font-size: 12px; letter-spacing: 2px; text-transform: uppercase; }
    .social-links a { color: #777; text-decoration: none; margin: 0 12px; transition: color 0.4s ease; }
    .social-links a:hover { color: #111; }
    
    .home-footer {
        margin-top: 90px;
        text-align: center;
        /* 启用古典学术文献专属的衬线字体栈 */
        font-family: "EB Garamond", Garamond, Baskerville, "Hoefler Text", "Times New Roman", serif;
        font-size: 16px; /* 略微调大，让衬线（Serif）的笔锋细节更清晰 */
        font-style: italic; /* 学术引用和铭文的标准排版 */
        color: #555; /* 降低纯黑的锐利感，模拟古典墨迹 */
        letter-spacing: 1.5px;
    }

    @media (max-width: 520px) {
        .home-page .site-nav { margin-top: 28px; }
        .home-container { padding-top: 20px; }
        .intro-stage { width: min(68vw, 270px); }
        .ingress-stroke { stroke-width: 2.15; }
        .home-watermark { width: 310px; right: -112px; bottom: -76px; opacity: 0; }
    }
</style>

</head>
<body class="home-page">
    
<!-- The full-viewport weave is decorative and deliberately absent after one session play. -->
<div class="intro-flower-container">
    <svg class="ingress-canvas" aria-hidden="true" preserveAspectRatio="none">
        <path class="ingress-stroke"></path>
        <path class="ingress-stroke"></path>
        <path class="ingress-stroke"></path>
        <path class="ingress-stroke"></path>
    </svg>
    <div class="intro-stage" aria-hidden="true">
        {{ partial "hydrangea-art.html" . }}
    </div>
    <button class="intro-skip" type="button">Skip</button>
</div>

<!-- Persistent background impression: the bloom survives as a faint paper watermark. -->
<div class="home-watermark" aria-hidden="true">
    {{ partial "hydrangea-art.html" . }}
</div>

{{ partial "site-nav.html" (dict "active" "home") }}

<div class="home-container">
    <header class="home-header">
        <img src="/images/photo.jpg" alt="Zhimu Yang" class="avatar">
        <h1 class="name">Zhimu Yang</h1>
        <p class="description">Aspiring Student in Theoretical Computer Science.</p>
    </header>

    <div class="social-links">
        <a href="https://github.com/muyuzhierchengse" target="_blank">Github</a>
        <span>·</span>
        <a href="https://scholar.google.cz/citations?hl=zh-CN&pli=1&user=kn206EMAAAAJ" target="_blank">Scholar</a>
        <span>·</span>
        <a href="mailto:Muyuzhierchengse@gmail.com">Email</a>
    </div>

    <div class="divider">☙ ❖ ❧</div>

    <footer class="about-footer" style="text-align: center; margin-top: 90px;">
        <div style="font-size: 15px; color: #444; line-height: 1.8; margin-bottom: 40px;">
            <p><i>“Wir müssen wissen — wir werden wissen”</i></p>
        </div>
    </footer>
</div>

</body>
</html>
