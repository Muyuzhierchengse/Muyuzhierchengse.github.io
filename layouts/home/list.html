<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home | Zhimu Yang</title>
    <link rel="stylesheet" href="/css/site-nav.css">
    <script>
        // Play the entrance sequence once per browser tab/session. Returning
        // from About or Research should reveal the home page immediately.
        try {
            // Version the key whenever the opening artwork changes materially,
            // so returning visitors are introduced to the new sequence once.
            if (sessionStorage.getItem("zhimu-home-intro-seen-v6") === "true") {
                document.documentElement.classList.add("skip-home-intro");
            } else {
                sessionStorage.setItem("zhimu-home-intro-seen-v6", "true");
            }
        } catch (error) {
            // If storage is unavailable, keep the normal first-visit animation.
        }

        // The visual sequence is decorative, so visitors can dismiss it at any
        // point without affecting navigation or the page content underneath.
        document.addEventListener("DOMContentLoaded", function () {
            // Direct requestAnimationFrame updates are used instead of the Web
            // Animations API because iOS Safari may discretise SVG dash motion.
            document.querySelectorAll(".intro-stage .hydrangea-line").forEach(function (line, index) {
                const length = line.getTotalLength();
                const delay = 1420 + index * 80;
                const duration = 2900;

                line.style.strokeDasharray = `${length} ${length}`;
                line.style.strokeDashoffset = `${length}`;
                line.style.opacity = "1";

                const runner = line.cloneNode(false);
                runner.removeAttribute("id");
                runner.classList.remove("hydrangea-line");
                runner.classList.add("hydrangea-runner");
                runner.style.strokeDasharray = `${length * 0.045} ${length * 0.955}`;
                runner.style.strokeDashoffset = "0";
                runner.style.opacity = "0";
                line.after(runner);

                const startedAt = performance.now();
                function drawFrame(now) {
                    const elapsed = now - startedAt - delay;
                    if (elapsed < 0) {
                        requestAnimationFrame(drawFrame);
                        return;
                    }
                    const progress = Math.min(elapsed / duration, 1);
                    // Smoothstep is stable across browsers and keeps both ends calm.
                    const eased = progress * progress * (3 - 2 * progress);
                    line.style.strokeDashoffset = `${length * (1 - eased)}`;
                    runner.style.strokeDashoffset = `${-length * 0.955 * eased}`;
                    runner.style.opacity = progress < 0.04
                        ? `${progress / 0.04}`
                        : progress > 0.94
                            ? `${(1 - progress) / 0.06}`
                            : "1";
                    if (progress < 1) {
                        requestAnimationFrame(drawFrame);
                    } else {
                        line.style.strokeDashoffset = "0";
                        runner.style.opacity = "0";
                    }
                }
                requestAnimationFrame(drawFrame);
            });

            const skipButton = document.querySelector(".intro-skip");
            if (skipButton) {
                skipButton.addEventListener("click", function () {
                    document.documentElement.classList.add("intro-complete");
                });
            }
        });
    </script>
    
<style>
    body {
        margin: 0;
        padding: 0;
        background-color: #fcfbf9;
        color: #2a2a2a;
        font-family: "Palatino Linotype", "Book Antiqua", Palatino, Georgia, serif;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        overflow-x: hidden;
    }

    .home-page .site-nav {
        position: relative;
        z-index: 1;
        margin-top: 40px;
        opacity: 0;
        transform: translateY(15px);
        animation: navReveal 1.2s cubic-bezier(0.16, 1, 0.3, 1) 5.15s forwards;
    }

    @keyframes navReveal {
        to { opacity: 1; transform: translateY(0); }
    }

    /*
     * HYDRANGEA INTRO — four continuous paths form the approved artwork.
     * 0.0–4.3s  four fixed-length line heads travel and leave ink behind
     * 4.3–5.1s  the completed hydrangea rests at the centre
     * 4.6–5.8s  the flower dissolves into the printed watermark
     *
     * The intro and every page watermark read the same SVG source, so their
     * geometry can never drift apart during future revisions.
     */
    .intro-flower-container {
        --flower-size: clamp(260px, 34vw, 380px);
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 999;
        overflow: hidden;
        background: #fcfbf9;
        animation: releaseIntro 1s ease 5.15s forwards;
    }

    .intro-stage {
        position: absolute;
        left: 50%;
        top: 50%;
        width: var(--flower-size);
        aspect-ratio: 1;
        transform: translate(-50%, -50%);
    }

    .intro-stage svg {
        width: 100%;
        height: 100%;
        overflow: visible;
        filter: drop-shadow(0 10px 20px rgba(68, 59, 52, 0.035));
    }

    /*
     * A short runner moves along each one-stroke route. The matching ink path
     * reveals at the same pace, creating one uninterrupted drawing gesture.
     */
    .intro-stage .hydrangea-line,
    .intro-stage .hydrangea-runner {
        fill: none;
        stroke: #5f5954;
        stroke-width: 2.35;
        stroke-linecap: round;
        stroke-linejoin: round;
        vector-effect: non-scaling-stroke;
    }

    .intro-stage .hydrangea-line {
        /* Prevent a flash of the completed drawing before JS measures it. */
        opacity: 0;
    }

    .intro-stage .hydrangea-runner {
        stroke-width: 3.15;
    }

    /*
     * Four fixed-length threads enter from beyond the viewport. Their final
     * endpoints coincide with the starts of the four SVG drawing paths; the
     * path runners appear during the final crossfade, reading as one gesture.
     */
    .approach-thread {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 54px;
        height: 1.6px;
        margin-left: -54px;
        border-radius: 999px;
        background: #5f5954;
        opacity: 0;
        transform-origin: right center;
        animation: approachThread 1.45s cubic-bezier(.35, .02, .18, 1) var(--approach-delay) forwards;
    }

    .approach-thread--a {
        --approach-delay: 0s;
        --start-x: -55vw; --start-y: -12vh; --start-r: 12deg;
        --mid-x: -28vw; --mid-y: -5vh; --mid-r: 2deg;
        --end-x: -117px; --end-y: 5px; --end-r: -8deg;
    }
    .approach-thread--b {
        --approach-delay: .08s;
        --start-x: 16vw; --start-y: -55vh; --start-r: 98deg;
        --mid-x: 8vw; --mid-y: -25vh; --mid-r: 72deg;
        --end-x: -1px; --end-y: 16px; --end-r: 22deg;
    }
    .approach-thread--c {
        --approach-delay: .16s;
        --start-x: -56vw; --start-y: 24vh; --start-r: -18deg;
        --mid-x: -31vw; --mid-y: 14vh; --mid-r: -8deg;
        --end-x: -162px; --end-y: 45px; --end-r: 3deg;
    }
    .approach-thread--d {
        --approach-delay: .24s;
        --start-x: 20vw; --start-y: 54vh; --start-r: -76deg;
        --mid-x: 12vw; --mid-y: 28vh; --mid-r: -88deg;
        --end-x: 8px; --end-y: 120px; --end-r: -102deg;
    }

    @keyframes approachThread {
        0% {
            opacity: 0;
            transform: translate(var(--start-x), var(--start-y)) rotate(var(--start-r));
        }
        12% { opacity: 1; }
        58% {
            opacity: 1;
            transform: translate(var(--mid-x), var(--mid-y)) rotate(var(--mid-r));
        }
        88% { opacity: 1; }
        100% {
            opacity: 0;
            transform: translate(var(--end-x), var(--end-y)) rotate(var(--end-r));
        }
    }

    @keyframes releaseIntro {
        0% { opacity: 1; visibility: visible; }
        100% { opacity: 0; visibility: hidden; }
    }

    .intro-skip {
        position: absolute;
        right: clamp(20px, 4vw, 54px);
        bottom: clamp(18px, 4vh, 38px);
        padding: 8px 4px;
        border: 0;
        border-bottom: 1px solid rgba(65, 60, 55, 0.25);
        background: transparent;
        color: #8a847e;
        font: 10px/1 Georgia, serif;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        cursor: pointer;
        pointer-events: auto;
    }

    .intro-skip:hover,
    .intro-skip:focus-visible { color: #2a2a2a; border-color: #2a2a2a; }

    /* The final "printed" motif is a separate copy for a seamless crossfade. */
    .home-watermark {
        position: fixed;
        right: clamp(-76px, -4vw, -24px);
        bottom: clamp(-64px, -3vw, -18px);
        width: clamp(260px, 34vw, 480px);
        aspect-ratio: 1;
        z-index: 0;
        opacity: 0;
        color: #716b65;
        pointer-events: none;
        animation: printWatermark 1.6s ease 4.55s forwards;
    }

    .home-watermark svg { width: 100%; height: 100%; overflow: visible; }
    .home-watermark .hydrangea-line {
        fill: none;
        stroke: currentColor;
        stroke-width: 2.4;
        vector-effect: non-scaling-stroke;
    }

    @keyframes printWatermark {
        from { opacity: 0; transform: translate(18px, 14px) rotate(3deg) scale(1.03); }
        to { opacity: 0.11; transform: translate(0, 0) rotate(0) scale(1); }
    }

    .home-container {
        position: relative;
        z-index: 1;
        max-width: 640px;
        width: 100%;
        text-align: center;
        padding: 40px 20px;
        opacity: 0;
        transform: translateY(10px);
        animation: contentReveal 1.5s cubic-bezier(0.16, 1, 0.3, 1) 5.05s forwards;
    }

    @keyframes contentReveal {
        to { opacity: 1; transform: translateY(0); }
    }

    .skip-home-intro .intro-flower-container,
    .intro-complete .intro-flower-container {
        display: none;
    }

    .skip-home-intro .site-nav,
    .skip-home-intro .home-container,
    .intro-complete .site-nav,
    .intro-complete .home-container {
        opacity: 1;
        transform: none;
        animation: none;
    }

    .skip-home-intro .home-watermark,
    .intro-complete .home-watermark {
        opacity: 0.11;
        transform: none;
        animation: none;
    }

    @media (prefers-reduced-motion: reduce) {
        .intro-flower-container { display: none; }
        .home-page .site-nav,
        .home-container {
            opacity: 1;
            transform: none;
            animation: none;
        }
        .home-watermark { opacity: 0.11; transform: none; animation: none; }
    }

    .avatar { width: 104px; height: 104px; border-radius: 50%; object-fit: cover; filter: grayscale(30%) contrast(1.1); margin-bottom: 24px; box-shadow: 0 8px 24px rgba(0,0,0,0.04); border: 1px solid rgba(0,0,0,0.03); }
    .name { font-size: 22px; letter-spacing: 6px; text-transform: uppercase; margin: 0 0 12px 0; font-weight: normal; color: #1a1a1a; }
    .description { font-size: 15px; font-style: italic; color: #666; margin-bottom: 30px; }
    .divider { font-size: 16px; color: #ccc; letter-spacing: 8px; margin: 30px 0 40px 0; user-select: none; }
    .social-links { margin-bottom: 50px; font-size: 12px; letter-spacing: 2px; text-transform: uppercase; }
    .social-links a { color: #777; text-decoration: none; margin: 0 12px; transition: color 0.4s ease; }
    .social-links a:hover { color: #111; }
    
    .home-footer {
        margin-top: 90px;
        text-align: center;
        /* 启用古典学术文献专属的衬线字体栈 */
        font-family: "EB Garamond", Garamond, Baskerville, "Hoefler Text", "Times New Roman", serif;
        font-size: 16px; /* 略微调大，让衬线（Serif）的笔锋细节更清晰 */
        font-style: italic; /* 学术引用和铭文的标准排版 */
        color: #555; /* 降低纯黑的锐利感，模拟古典墨迹 */
        letter-spacing: 1.5px;
    }

    @media (max-width: 520px) {
        .home-page .site-nav { margin-top: 28px; }
        .home-container { padding-top: 20px; }
        .intro-stage { width: min(68vw, 270px); }
        .approach-thread { width: 46px; margin-left: -46px; height: 1.45px; }
        .approach-thread--a { --end-x: -83px; --end-y: 4px; }
        .approach-thread--b { --end-x: -1px; --end-y: 11px; }
        .approach-thread--c { --end-x: -115px; --end-y: 32px; }
        .approach-thread--d { --end-x: 5px; --end-y: 86px; }
        .home-watermark { width: 310px; right: -112px; bottom: -76px; opacity: 0; }
    }
</style>

</head>
<body class="home-page">
    
<!-- The full-viewport weave is decorative and deliberately absent after one session play. -->
<div class="intro-flower-container">
    <div class="approach-field" aria-hidden="true">
        <span class="approach-thread approach-thread--a"></span>
        <span class="approach-thread approach-thread--b"></span>
        <span class="approach-thread approach-thread--c"></span>
        <span class="approach-thread approach-thread--d"></span>
    </div>
    <div class="intro-stage" aria-hidden="true">
        {{ partial "hydrangea-art.html" . }}
    </div>
    <button class="intro-skip" type="button">Skip</button>
</div>

<!-- Persistent background impression: the bloom survives as a faint paper watermark. -->
<div class="home-watermark" aria-hidden="true">
    {{ partial "hydrangea-art.html" . }}
</div>

{{ partial "site-nav.html" (dict "active" "home") }}

<div class="home-container">
    <header class="home-header">
        <img src="/images/photo.jpg" alt="Zhimu Yang" class="avatar">
        <h1 class="name">Zhimu Yang</h1>
        <p class="description">Aspiring Student in Theoretical Computer Science.</p>
    </header>

    <div class="social-links">
        <a href="https://github.com/muyuzhierchengse" target="_blank">Github</a>
        <span>·</span>
        <a href="https://scholar.google.cz/citations?hl=zh-CN&pli=1&user=kn206EMAAAAJ" target="_blank">Scholar</a>
        <span>·</span>
        <a href="mailto:Muyuzhierchengse@gmail.com">Email</a>
    </div>

    <div class="divider">☙ ❖ ❧</div>

    <footer class="about-footer" style="text-align: center; margin-top: 90px;">
        <div style="font-size: 15px; color: #444; line-height: 1.8; margin-bottom: 40px;">
            <p><i>“Wir müssen wissen — wir werden wissen”</i></p>
        </div>
    </footer>
</div>

</body>
</html>
